name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu gotur
        uses: actions/checkout@v4

      - name: Java 21 qur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Node.js 22 qur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capacitor ve Android muhiti hazirla
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Saleh Evolution Ultra 60" "com.saleh.evolution" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Tətbiq İkonasını Hazırla
        run: |
          if [ -f icon.png ]; then
            python3 -c "
          import os
          from PIL import Image

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }

          img = Image.open('icon.png').convert('RGBA')
          res_dir = 'android/app/src/main/res'

          for folder, size in sizes.items():
              d = os.path.join(res_dir, folder)
              os.makedirs(d, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(d, 'ic_launcher.png'))
              resized.save(os.path.join(d, 'ic_launcher_round.png'))
              resized.save(os.path.join(d, 'ic_launcher_foreground.png'))
          "
          fi

      - name: APK Yig
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK-ni yukle
        uses: actions/upload-artifact@v4
        with:
          name: Saleh-Evolution-Ultra-60-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
