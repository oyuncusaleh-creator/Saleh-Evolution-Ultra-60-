name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu gotur
        uses: actions/checkout@v4

      - name: Java 17 qur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js qur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capacitor ve Android muhiti hazirla
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Saleh Evolution" "com.saleh.evolution" --web-dir www
          npx cap add android
          npx cap copy android

      - name: APK Yig
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK-ni yukle
        uses: actions/upload-artifact@v4
        with:
          name: Saleh-Evolution-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
